<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyber-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #334155;
      stroke-width: 0.5;
      stroke-opacity: 0.25;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .orbit-node {
      animation: float 6s ease-in-out infinite alternate;
    }
    .orbit-node-rev {
      animation: float-rev 7s ease-in-out infinite alternate;
    }
    .scan-beam {
      animation: scan 8s linear infinite;
    }
    .data-flow {
      stroke-dasharray: 8 12;
      animation: flow 20s linear infinite;
    }

    @keyframes pulse {
      0% { r: 120px; opacity: 0.2; }
      100% { r: 160px; opacity: 0.45; }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-10px) translateX(8px); }
    }
    @keyframes float-rev {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(12px) translateX(-6px); }
    }
    @keyframes scan {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes flow {
      to { stroke-dashoffset: -400; }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Lines (Background Tech Pattern) -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Animated Background Orbs / Glows (strictly behind content) -->
  <circle cx="150" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-circle" opacity="0.25" />
  <circle cx="1050" cy="180" r="150" fill="#c084fc" filter="url(#glow)" class="pulse-circle" opacity="0.2" />

  <!-- Animated Data Flow Lines (strictly behind text) -->
  <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="data-flow" />
  <path d="M 50 310 Q 300 350 600 310 T 1150 310" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35" class="data-flow" />

  <!-- Floating Dynamic Tech Cards / Pills (Anchored at sides so text is 100% visible) -->
  <!-- Left Side Badges/Cards -->
  <g class="orbit-node">
    <!-- Audit Node -->
    <rect x="50" y="110" width="130" height="42" rx="21" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="72" cy="131" r="5" fill="#38bdf8" />
    <text x="86" y="136" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🛡️ Guardrails</text>

    <!-- Verifier Node -->
    <rect x="70" y="210" width="145" height="42" rx="21" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="92" cy="231" r="5" fill="#818cf8" />
    <text x="106" y="236" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🔍 Verification</text>
  </g>

  <!-- Right Side Badges/Cards -->
  <g class="orbit-node-rev">
    <!-- Observability Node -->
    <rect x="1010" y="110" width="145" height="42" rx="21" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="1032" cy="131" r="5" fill="#c084fc" />
    <text x="1046" y="136" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">📊 Observability</text>

    <!-- Red Teaming Node -->
    <rect x="990" y="210" width="155" height="42" rx="21" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.2" filter="url(#soft-glow)" />
    <circle cx="1012" cy="231" r="5" fill="#f43f5e" />
    <text x="1026" y="236" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🎯 Misalignment</text>
  </g>

  <!-- Horizontal Glow Separator -->
  <line x1="280" y1="262" x2="920" y2="262" stroke="url(#cyber-line)" stroke-width="2" />

  <!-- Scanning Beam Effect across separator -->
  <rect x="0" y="261" width="120" height="4" fill="#38bdf8" filter="url(#soft-glow)" opacity="0.6" class="scan-beam" />

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Tag -->
  <g>
    <rect x="475" y="46" width="250" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="600" y="65" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">⚡ TRUSTWORTHY AI AGENT ECOSYSTEM</text>
  </g>

  <!-- Main Title (Clear Foreground, Never obscured) -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5" filter="url(#soft-glow)">
    AI AGENT AUDITING &amp; VERIFICATION
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#f1f5f9" letter-spacing="0.2">
    Behavior Verification • Misalignment Auditing • Safety Guardrails • Trajectory Evals
  </text>

  <!-- Secondary Meta line -->
  <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    Curated Index of Enterprise SaaS Platforms &amp; Open-Source Testing Frameworks
  </text>

  <!-- Bottom Pills: Topics -->
  <g>
    <!-- Pill 1 -->
    <rect x="360" y="286" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="430" y="304" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent Evaluation</text>

    <!-- Pill 2 -->
    <rect x="520" y="286" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="600" y="304" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Multi-Agent Red Teaming</text>

    <!-- Pill 3 -->
    <rect x="700" y="286" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="770" y="304" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LLM Observability</text>
  </g>
</svg>
